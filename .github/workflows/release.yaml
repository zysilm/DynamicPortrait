name: Release Plugin

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dynamicportrait-release
  cancel-in-progress: false

env:
  PLUGIN_NAME: DynamicPortrait
  SOLUTION_DIR: DynamicPortrait

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version and manifest
        run: python3 .github/scripts/release.py --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Dalamud
        run: |
          mkdir -p "$RUNNER_TEMP/dalamud"
          curl --fail --location https://goatcorp.github.io/dalamud-distrib/latest.zip -o "$RUNNER_TEMP/dalamud.zip"
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$RUNNER_TEMP/dalamud"

      - name: Camera math checks
        run: dotnet run --project Tests/CameraMath/CameraMath.csproj -c Release

      - name: Build
        run: dotnet build ${{ env.SOLUTION_DIR }}/${{ env.PLUGIN_NAME }}.csproj -c Release -p:RestoreLockedMode=true
        env:
          DALAMUD_HOME: ${{ runner.temp }}/dalamud

      - name: Extract version
        id: version
        run: |
          python3 -c 'import os, xml.etree.ElementTree as ET; v = ET.parse("DynamicPortrait/DynamicPortrait.csproj").findtext(".//Version"); print("version=" + v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'

      - name: Prepare release artifacts and pluginmaster.json
        run: python3 .github/scripts/release.py --tag "v${{ steps.version.outputs.version }}" --repository "$GITHUB_REPOSITORY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: |
            artifacts/DynamicPortrait.zip
            artifacts/pluginmaster.json
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.PLUGIN_NAME }} v${{ steps.version.outputs.version }}
          files: |
            artifacts/DynamicPortrait.zip
            artifacts/pluginmaster.json
            LICENSE
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true

      - name: Update pluginmaster.json on main
        run: |
          cp artifacts/pluginmaster.json "$RUNNER_TEMP/pluginmaster.json"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main exists; its release will update the repository index."
            exit 0
          fi
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/pluginmaster.json" pluginmaster.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if git diff --cached --quiet; then
            echo "pluginmaster.json already up to date"
          else
            git commit -m "Update pluginmaster.json for v${{ steps.version.outputs.version }} [skip ci]"
            git push origin main
          fi
